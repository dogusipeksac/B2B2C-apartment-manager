include: package:very_good_analysis/analysis_options.yaml

# Note: Dart analyzer supports a single `include:`. We keep `flutter_lints`
# as a dev_dependency per spec, and rely on `very_good_analysis` as the active
# ruleset (it is stricter and Flutter-friendly).
linter:
  rules:
    public_member_api_docs: false
    prefer_single_quotes: true
    always_use_package_imports: true
